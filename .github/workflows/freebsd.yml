# FreeBSD 15: a real ./install.sh --yes in a VM (vmactions), then verify and an idempotency
# re-run (tests/installer/full-install.sh), like full-install.yml does in Linux containers.
# Both desktops: i3 on X11 (the default; also started in Xvfb, screenshots uploaded) and
# Hyprland (built from the port overlay in ports/).
name: freebsd

on:
  workflow_dispatch:
  push:
    paths:
      - install.sh
      - lib/**
      - packages/freebsd/**
      - ports/**
      - bin/**
      - config/**
      - themes/**
      - home/**
      - tests/installer/**
      - tests/x11/**
      - .github/workflows/freebsd.yml
      - '!lib/platform/gentoo.sh'
      - '!config/portage/**'

jobs:
  install:
    name: install (freebsd 15, ${{ matrix.desktop }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        desktop: [i3, hyprland]
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 12288
          prepare: pkg install -y bash
          # The VM step copies the workspace back only when it succeeds: keep the exit code in a
          # file so the screenshots come back from a failing run too; the Result step fails.
          run: |
            rc=0
            env SRC="$GITHUB_WORKSPACE" RICE_DESKTOP=${{ matrix.desktop }} bash tests/installer/full-install.sh || rc=$?
            echo "$rc" > full-install.rc
      - uses: actions/upload-artifact@v4
        if: always() && matrix.desktop == 'i3'
        with:
          name: freebsd-i3-screenshots
          path: x11-shots/
          if-no-files-found: ignore
      - name: Result
        run: exit "$(cat full-install.rc 2> /dev/null || echo 1)"
