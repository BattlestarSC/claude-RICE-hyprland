# A real ./install.sh --yes in a fresh container of each supported system, as a sudo user, then
# tests/installer/verify-install.sh and an idempotency re-run. Slow (the full package set,
# TeX Live included, is several GB), so it runs when the installer, packages, configs or
# scripts change, and on demand.
name: full-install

on:
  workflow_dispatch:
  push:
    paths:
      - install.sh
      - lib/**
      - packages/**
      - bin/**
      - config/**
      - themes/**
      - home/**
      - tests/installer/**
      - .github/workflows/full-install.yml
      # Platforms this workflow does not install (gentoo.yml resolves Gentoo).
      - '!lib/platform/gentoo.sh'
      - '!packages/gentoo/**'
      - '!config/portage/**'

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            cache: /var/cache/pacman/pkg
          - image: ubuntu:26.04
            cache: /var/cache/apt/archives
    name: install (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h / /mnt
      - name: Install and verify in ${{ matrix.image }}
        run: |
          sudo mkdir -p /mnt/package-cache
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "/mnt/package-cache:${{ matrix.cache }}" \
            "${{ matrix.image }}" bash /src/tests/installer/full-install.sh

  # FreeBSD runs in a VM (vmactions); everything else as in the containers above.
  freebsd:
    name: install (freebsd 15)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          mem: 12288
          prepare: pkg install -y bash
          run: env SRC="$GITHUB_WORKSPACE" bash tests/installer/full-install.sh
