# hypridle: what happens when you step away (hyprlang, not Lua). Timeline:
#    5 min  screensaver          (pending: see docs/decisions.md O14; not wired yet)
#   10 min  lock                 (loginctl lock-session -> lock_cmd -> hyprlock)
#   11 min  monitors off (DPMS)  (the best protection against burn-in, and zero power)
#   no automatic suspend: long Blender renders do not inhibit idle and would be interrupted.
# Media players that hold an idle inhibitor (video playback) pause every listener.

general {
    lock_cmd = pidof hyprlock || hyprlock                 # one instance only
    before_sleep_cmd = loginctl lock-session              # lock before any suspend/hibernate
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # Nothing can be seen behind the lock screen: stop the animated wallpaper meanwhile.
    on_lock_cmd = qs ipc call sky pause
    on_unlock_cmd = qs ipc call sky resume
    # inhibit_sleep stays at its default (2 = auto): with hyprlock in lock_cmd and lock-session in
    # before_sleep_cmd it waits until the lock is actually up before the machine sleeps.
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Optional automatic suspend (uncomment in your copy; renders and downloads stop while asleep):
# listener {
#     timeout = 3600
#     on-timeout = systemctl suspend
# }
