# hyprlock: the lock screen (hyprlang, not Lua). Started by hypridle's lock_cmd, i.e. by
# `loginctl lock-session` ($mod+Shift+x, the session menu, before suspend, or on idle).
#
# Security model (docs/knowledge-base/hypr-ecosystem.md#lock-screen):
# - ext-session-lock: while locked the compositor shows only lock surfaces, so windows and
#   notifications never appear; if hyprlock crashes the session stays locked (red "lockdead"
#   screen) and misc.allow_session_lock_restore lets you start a new hyprlock from a TTY.
# - PAM service "hyprlock" (/etc/pam.d/hyprlock from the package); Arch's pambase faillock locks
#   the account for 10 minutes after 3 failures (/etc/security/faillock.conf).
# - This file must exist: hyprlock without a config exits and leaves the session UNLOCKED.
source = ~/.config/hypr/theme/colors.conf

$font      = IBM Plex Sans
$font_mono = IBM Plex Mono

general {
    hide_cursor = true
    ignore_empty_input = true   # Enter on an empty field does not count as a failed attempt
    fail_timeout = 2000
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    animation = fadeIn, 0                    # cover the desktop at once (matters before suspend)
    animation = fadeOut, 1, 3, out
    animation = inputFieldColors, 1, 2, out
    animation = inputFieldDots, 1, 1, out
}

# The ASCII sky as a still, rendered by the installer; missing file -> plain $crust.
background {
    monitor =
    path = ~/.local/share/rice/lock.png
    color = $crust
}

# Dim the art so the text keeps its contrast.
shape {
    monitor =
    size = 100%, 100%
    color = $crust_a45
    rounding = 0
    border_size = 0
    zindex = 0
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 88
    font_family = $font_mono
    position = 0, 18%
    halign = center
    valign = center
    zindex = 1
}

# Date (refreshed every minute)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $subtext
    font_size = 18
    font_family = $font
    position = 0, 10%
    halign = center
    valign = center
    zindex = 1
}

# Password: the Orbit frame (red -> purple), yellow while checking, orange with Caps Lock.
input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    rounding = 14
    outer_color = $red $purple 45deg
    inner_color = $surface0_a85
    font_color = $text
    font_family = $font
    placeholder_text = $USER
    check_color = $yellow
    fail_color = $orange $red 45deg
    fail_text = $PAMFAIL ($ATTEMPTS)
    capslock_color = $orange
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    position = 0, -2%
    halign = center
    valign = center
    zindex = 1
}

# Keyboard layout, shown only when it is not the first one.
label {
    monitor =
    text = $LAYOUT[!]
    color = $overlay
    font_size = 12
    font_family = $font
    position = 0, -7%
    halign = center
    valign = center
    zindex = 1
}
