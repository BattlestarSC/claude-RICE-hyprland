# xdg-desktop-portal-hyprland (hyprlang, not Lua): screen sharing for apps (browsers, OBS...).
# The picker is the rice's rofi one (bin/rice-share-picker). XDPH needs an absolute path and
# hyprlang does not expand environment variables in values, so the installer writes your home
# directory in place of the "~". XDPH reads this file at start: after editing it,
#   systemctl --user restart xdg-desktop-portal-hyprland
# Remove the line (or the file) to go back to XDPH's own picker (hyprland-share-picker).
# Docs: docs/knowledge-base/hypr-ecosystem.md#screen-share-picker

screencopy {
    custom_picker_binary = ~/.local/bin/rice-share-picker
}
