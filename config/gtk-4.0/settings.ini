; GTK4 / libadwaita. Colors: ~/.config/gtk-4.0/gtk.css (generated CSS variables).
; libadwaita ignores gtk-theme-name; adw-gtk3's README recommends setting it anyway for plain GTK4 apps.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=IBM Plex Sans 11
