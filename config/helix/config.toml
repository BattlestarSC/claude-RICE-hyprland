# Helix editor settings for the rice. Deployed to ~/.config/helix/config.toml (the installer backs
# up an existing file). Helix has no include mechanism: put your own changes here or in a
# project's .helix/config.toml. Keys: Helix 25.07 book, editor.md (unknown keys are an error,
# Helix then starts with defaults; tests/editors/check_helix.py checks them).
theme = "rice"

[editor]
line-number = "relative"
cursorline = true
scrolloff = 8
mouse = true
bufferline = "multiple"
color-modes = true
true-color = true
undercurl = true
rulers = [100]
popup-border = "all"
completion-timeout = 5
completion-trigger-len = 1
end-of-line-diagnostics = "hint"

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "selections", "register", "file-type", "position", "file-encoding"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-inlay-hints = true
display-progress-messages = true

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.indent-guides]
render = true
character = "│"

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "error"

[editor.whitespace.render]
tab = "all"
nbsp = "all"
