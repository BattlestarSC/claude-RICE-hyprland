; GTK3 (Thunar, file pickers). Colors: ~/.config/gtk-3.0/gtk.css (generated, themes/<palette>/gtk-3.0/).
; Under Wayland, GTK reads these through gsettings/the settings portal first; the installer sets
; the same values with gsettings (docs/knowledge-base/theming.md#gtk-and-file-managers).
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=IBM Plex Sans 11
