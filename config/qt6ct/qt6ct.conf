; rice: qt6ct settings, used by every Qt 6 app (QT_QPA_PLATFORMTHEME=qt6ct in hypr/conf/env.lua).
; Installed once (only if absent): the qt6ct GUI rewrites this file when you change something.
; Keys: qt6ct src/qt6ct-qtplugin/qt6ctplatformtheme.cpp readSettings. Colors: colors/rice.conf
; (generated from the palette; "~" is expanded by qt6ct). Docs: docs/knowledge-base/theming.md#qt-apps-qt6ct

[Appearance]
style=Breeze
custom_palette=true
color_scheme_path=~/.config/qt6ct/colors/rice.conf
icon_theme=Papirus-Dark
standard_dialogs=default

[Fonts]
general="IBM Plex Sans,11"
fixed="JetBrains Mono,11"
