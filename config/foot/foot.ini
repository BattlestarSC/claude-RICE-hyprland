# foot: the rice's secondary terminal (Wayland-native, very light; a good fallback when kitty's
# GPU renderer is unavailable). Colors: theme.ini, generated from the palette.
# Your own changes: ~/.config/foot/local.ini, included last so it wins. The installer creates it
# empty if it does not exist (foot reports a missing include as an error) and never overwrites it.
# Key names: foot 1.28.0 (docs/knowledge-base/kitty.md#foot).

[main]
include=~/.config/foot/theme.ini
font=JetBrainsMono Nerd Font:size=11
pad=10x6

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[bell]
urgent=yes

[main]
include=~/.config/foot/local.ini
