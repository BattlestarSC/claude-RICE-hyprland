# kitty: the rice's primary terminal. Behavior only; colors live in theme.conf (generated from
# the palette: themes/<palette>/kitty/theme.conf). kitty reloads this file on save.
# Your own changes: ~/.config/kitty/local.conf (optional, never touched by the installer).
# Every option was checked against kitty's kitty/options/definition.py (docs/knowledge-base/kitty.md).

include theme.conf

# ---- Font: JetBrains Mono (unpatched, ttf-jetbrains-mono) + Nerd Font icons ----
font_family       JetBrains Mono
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         11.0
# Ligatures everywhere, including under the cursor (JetBrains Mono's `calt`; on by default in the
# font). Use `cursor` instead to see the raw characters while editing over them.
disable_ligatures never

# Every Nerd Font icon comes from Symbols Nerd Font Mono (ttf-nerd-fonts-symbols-mono), so icons
# are single-cell and identical whatever the text font. Ranges = that font's private-use blocks
# plus the few standard code points Nerd Fonts adds (read from its cmap, Nerd Fonts 3.4.0).
symbol_map U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B8,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58 Symbols Nerd Font Mono

# ---- Cursor ----
cursor_shape          block
cursor_blink_interval 0
# A short purple trail when the cursor jumps (after resting 3 ms): easy to follow, fits the theme.
cursor_trail          3
cursor_trail_decay    0.1 0.3

# ---- Scrollback, mouse, URLs ----
scrollback_lines      10000
url_style             curly
copy_on_select        no
strip_trailing_spaces smart

# ---- Bell: no sound; mark the window instead ----
enable_audio_bell     no
visual_bell_duration  0
window_alert_on_bell  yes

# ---- Window ----
# Inner padding in pt: vertical, horizontal. Hyprland draws the gaps and border.
window_padding_width  6 10
remember_window_size  no
# Only ask before closing when a program is running (not at an idle shell prompt).
confirm_os_window_close -1
# Opaque: translucency lowers contrast unpredictably. Set e.g. 0.92 in local.conf to try it.
background_opacity    1.0

# ---- Tabs (kitty's own; windows are tiled by Hyprland) ----
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   round
tab_title_template    "{index} {title}"

# ---- Integration and privacy ----
shell_integration     enabled
# Distro builds never check for updates; this keeps it off for official binaries too.
update_check_interval 0
# Remote control stays off (kitty's default); nothing in the rice needs it.

globinclude local.conf
