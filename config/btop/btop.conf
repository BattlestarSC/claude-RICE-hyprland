#? rice settings for btop (v1.4.8 option names, src/btop_config.cpp). btop rewrites this file
#? with all of its options when it exits, keeping these values; settings changed in its menu
#? (Esc > Options) are saved the same way.

#* The generated rice theme (~/.config/btop/themes/rice.theme).
color_theme = "rice"
theme_background = True
truecolor = True
rounded_corners = True
graph_symbol = "braille"

#* h j k l g G move in lists, as in the editors.
vim_keys = True

update_ms = 1500
proc_tree = False
proc_gradient = True
temp_scale = "celsius"
clock_format = "%H:%M"
show_battery = True
