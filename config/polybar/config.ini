; polybar for the i3 session: the Orbit Glass bar on X11. A floating dark-glass strip (picom
; blurs it and rounds it like the Quickshell bar), workspaces left, window title in the middle,
; telemetry pills right. "main" runs on the primary monitor, "side" on the others
; (rice-bar launch). Colors: colors.ini, generated from the palette; never put a color here.
; Keys: polybar 3.7 wiki (Configuration, Modules). Your own additions: local.ini.

include-file = colors.ini

[settings]
screenchange-reload = true
pseudo-transparency = false

[bar/main]
monitor = ${env:MONITOR:}
width = 100%:-12
height = 32
offset-x = 6
offset-y = 6
radius = 14
fixed-center = true
background = ${colors.glass}
foreground = ${colors.text}
line-size = 2
border-size = 1
border-color = ${colors.surface1}
padding-left = 1
padding-right = 2
module-margin = 1
separator =
font-0 = IBM Plex Sans:size=10;2
font-1 = Symbols Nerd Font:size=11;3
font-2 = IBM Plex Sans:weight=bold:size=10;2
modules-left = session i3
modules-center = title
modules-right = media cpu mem load disk net vol tray date
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
; Floating like the Quickshell bar: i3 would place a managed dock window at full width, so the
; bar is override-redirect, i3 leaves it room (gaps top in ~/.config/i3/config) and polybar
; restacks it below fullscreen windows itself. picom matches its class, "Polybar".
override-redirect = true
wm-restack = i3

[bar/side]
inherit = bar/main
modules-left = i3
modules-center = title
modules-right = date

[module/session]
type = custom/text
label =
label-foreground = ${colors.purple}
label-padding = 1
click-left = rice-menu session

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-foreground = ${colors.crust}
label-mode-background = ${colors.orange}
label-mode-padding = 1
label-focused = %name%
label-focused-foreground = ${colors.bright}
label-focused-background = ${colors.surface1}
label-focused-underline = ${colors.purple}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.overlay}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.subtext}
label-visible-underline = ${colors.surface2}
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

[module/title]
type = internal/xwindow
label = %title:0:80:…%
label-foreground = ${colors.subtext}

[module/media]
type = custom/script
exec = rice-bar media
interval = 2
label-foreground = ${colors.pink}
click-left = playerctl play-pause
scroll-up = playerctl next
scroll-down = playerctl previous

[module/cpu]
type = custom/script
exec = rice-bar cpu
tail = true
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.cyan}
format-background = ${colors.pill}
format-padding = 1

[module/mem]
type = custom/script
exec = rice-bar mem
interval = 5
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.green}
format-background = ${colors.pill}
format-padding = 1

[module/load]
type = custom/script
exec = rice-bar load
interval = 5
format-prefix = "󰊚 "
format-prefix-foreground = ${colors.yellow}
format-background = ${colors.pill}
format-padding = 1

[module/disk]
type = custom/script
exec = rice-bar disk
interval = 60
format-prefix = "󰋊 "
format-prefix-foreground = ${colors.blue}
format-background = ${colors.pill}
format-padding = 1

[module/net]
type = custom/script
exec = rice-bar net
interval = 10
format-foreground = ${colors.cyan}
format-background = ${colors.pill}
format-padding = 1

[module/vol]
type = custom/script
exec = rice-bar vol
interval = 1
format-foreground = ${colors.purple}
format-background = ${colors.pill}
format-padding = 1
click-left = rice-volume mute
scroll-up = rice-volume up
scroll-down = rice-volume down

[module/tray]
type = internal/tray
tray-size = 60%
tray-spacing = 6px

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %{T3}%time%%{T-}
label-foreground = ${colors.bright}

; Yours (created empty by the installer, never overwritten; polybar stops on a missing include).
include-file = local.ini
