# The login screen of the i3 session, styled like ReGreet on Linux: the ASCII sky still behind a
# dark glass form. Installed as /usr/local/etc/lightdm/lightdm-gtk-greeter.conf.d/50-rice.conf
# (read before lightdm-gtk-greeter.conf; keys: lightdm-gtk-greeter.conf in the package).
# Colors: the GTK theme "Quasar-greeter" (/usr/local/share/themes/Quasar-greeter/, generated).
# The installer writes the chosen cursor theme in place of capitaine-cursors-light.
[greeter]
theme-name=Quasar-greeter
icon-theme-name=Papirus-Dark
cursor-theme-name=capitaine-cursors-light
cursor-theme-size=24
font-name=IBM Plex Sans 11
xft-antialias=true
xft-hintstyle=hintslight
background=/usr/local/etc/lightdm/rice/background.png
user-background=false
transition-type=none
hide-user-image=true
panel-position=top
clock-format=%a %d %b  %H:%M
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
