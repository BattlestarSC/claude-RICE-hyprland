# LightDM for the i3 session (FreeBSD). Installed as
# /usr/local/etc/lightdm/lightdm.conf.d/50-rice.conf: LightDM reads lightdm.conf.d/*.conf before
# lightdm.conf, so a setting you make in lightdm.conf itself still wins (lightdm
# common/configuration.c). The package's own files are not changed.
[Seat:*]
greeter-session=lightdm-gtk-greeter
# "Rice (i3)" (/usr/local/share/xsessions/rice-i3.desktop) unless you pick another session.
user-session=rice-i3
