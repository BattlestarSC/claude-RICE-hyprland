# Generated by tools/render_theme.py from colors/quasar.toml. Do not edit; edit the template.
# picom for the rice's i3 session (FreeBSD; X11). Gives i3 what Hyprland draws itself: rounded
# corners (6 px, as hypr/conf/look.lua), soft shadows, a blur behind the translucent bar,
# launcher and notifications, and short fades. Options: picom v13 man page (window rules).
# Installed as ~/.config/picom/picom.conf.

backend = "glx";            # xrender is the fallback without working OpenGL: picom --backend xrender
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Shadows: wide and faint, tinted with the palette's darkest tone instead of pure black.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-color = "#0F0E14";

# Rounding: windows like Hyprland's 6 px; the bar and rofi carry their own (larger) radii.
corner-radius = 6;

# Blur behind translucent surfaces (polybar, rofi, dunst use alpha backgrounds).
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = false;    # enabled per window below

# Fades: quick, so i3 still feels instant.
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

rules = (
    { match = "window_type = 'tooltip'"; fade = false; shadow = true; opacity = 0.95; full-shadow = false; },
    { match = "window_type = 'dock' || window_type = 'desktop'"; corner-radius = 0; shadow = false; },
    { match = "class_g = 'Polybar'"; blur-background = true; corner-radius = 14; shadow = true; },
    { match = "class_g = 'Rofi'"; blur-background = true; corner-radius = 0; shadow = false; },
    { match = "class_g = 'Dunst'"; blur-background = true; corner-radius = 12; },
    { match = "class_g = 'i3lock'"; shadow = false; corner-radius = 0; fade = false; },
    { match = "fullscreen"; corner-radius = 0; },
    { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },
)
