; Generated by tools/render_theme.py from colors/quasar.toml. Do not edit; edit the template.
; Quasar for TeXstudio. Installed to ~/.config/texstudio/texstudio.ini only if that file does not
; exist yet (TeXstudio rewrites it with all settings when it exits; later runs leave it alone).
; UI: the built-in "Adwaita Dark (txs)" style, which also switches TeXstudio's syntax colors to its
; dark set; those are replaced here by the palette ([formatsDark], QFormatScheme 1.0). Keys and
