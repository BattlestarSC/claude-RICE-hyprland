# Generated by tools/render_theme.py from colors/quasar.toml. Do not edit; edit the template.
# Quasar for starship: a two-line "rainbow" prompt with powerline arrows.
# Deployed to ~/.config/starship.toml. Generated (the palette is inline because starship reads a
# single file); edit templates/starship/starship.toml, not this file.
#
#  ╭─ 󰣇 ~/src/rice  main +1 !2 ⇡1 ───────────── 󰅙 130 INT  󰔟 5s  󰅐 16:23:42
#  ╰─❯
# Left: OS (+ user@host over SSH or as root), directory, git. Right: exit status (code, signal,
# meaning, every command of a pipeline), duration, background jobs, language versions, clock.
# Module and option names: starship v1.25.1 (docs/knowledge-base/zsh.md#prompt-starship).
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'rice'
add_newline = true
continuation_prompt = '[∙](overlay) '

format = """\
[╭─](surface2)\
$os$username$hostname\
[](fg:surface1 bg:blue)\
$directory\
$git_branch$git_commit$git_state$git_metrics$git_status\
 $fill \
$status$cmd_duration$jobs$python$nodejs$rust$golang$time\
$line_break\
[╰─](surface2)$character"""

[palettes.rice]
crust = '#0F0E14'
mantle = '#14131A'
base = '#191820'
surface0 = '#23212C'
surface1 = '#2C2B38'
surface2 = '#3F3D50'
overlay = '#9D99AD'
subtext = '#BAB6C6'
text = '#E4E0E9'
bright = '#F3F1F6'
red = '#FD8DA8'
orange = '#F69C56'
yellow = '#DCCD77'
green = '#A6DA64'
cyan = '#78D3E3'
blue = '#88AFFD'
purple = '#BEA0FE'
pink = '#FB89CD'

[fill]
symbol = '─'
style = 'surface2'

# ---- Left segment chain: OS → directory → git ----------------------------------------------
[os]
disabled = false
style = 'bg:surface1 fg:text'
format = '[ $symbol ]($style)'

[os.symbols]
Arch = '󰣇'
Linux = '󰌽'

# Shown only as root, over SSH, or as a different user than the one logged in.
[username]
style_user = 'bg:surface1 fg:text'
style_root = 'bg:surface1 fg:red bold'
format = '[$user ]($style)'

[hostname]
ssh_only = true
style = 'bg:surface1 fg:text'
format = '[@$hostname ]($style)'

# The directory segment closes the chain outside git repos (format) and hands over to the green
# git segment inside them (repo_root_format, used whenever repo_root_style is set and the path is
# not truncated; truncation_length = 0 never truncates). git_status, always rendered inside a
# work tree, draws the git segment's closing arrow.
[directory]
truncation_length = 0
truncate_to_repo = false
home_symbol = '~'
style = 'bg:blue fg:crust'
before_repo_root_style = 'bg:blue fg:crust'
repo_root_style = 'bg:blue fg:crust bold'
read_only = ' 󰌾'
read_only_style = 'bg:blue fg:red'
format = '[ $path ]($style)[$read_only]($read_only_style)[](fg:blue)'
repo_root_format = '[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)[$read_only]($read_only_style)[](fg:blue bg:green)'

[git_branch]
only_attached = true
symbol = ' '
style = 'bg:green fg:crust'
format = '[ $symbol$branch(:$remote_branch) ]($style)'

[git_commit]
only_detached = true
tag_disabled = false
style = 'bg:green fg:crust'
format = '[ 󰜘 $hash$tag ]($style)'

[git_state]
style = 'bg:green fg:crust bold'
format = '[\($state( $progress_current/$progress_total)\) ]($style)'

[git_metrics]
disabled = false
added_style = 'bg:green fg:crust'
deleted_style = 'bg:green fg:crust'
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[git_status]
style = 'bg:green fg:crust'
conflicted = '=${count} '
ahead = '󰁝${count} '
behind = '󰁅${count} '
diverged = '󰁝${ahead_count}󰁅${behind_count} '
untracked = '?${count} '
stashed = '\$${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '󰅖${count} '
format = '[($all_status$ahead_behind)]($style)[](fg:green)'

# ---- Right side: status, duration, jobs, languages, clock --------------------------------
# Exit status of the previous command, only when it failed: code, signal name (130 → INT),
# meaning (127 → NOTFOUND, 126 → NOPERM, 2 → USAGE…), and each command of a pipeline.
[status]
disabled = false
map_symbol = true
recognize_signal_code = true
pipestatus = true
symbol = '󰅙 '
sigint_symbol = '󰜺 '
signal_symbol = '󱐋 '
not_found_symbol = '󰋗 '
not_executable_symbol = '󰌾 '
style = 'bg:red fg:crust'
format = '[](fg:red)[ $symbol$status( $signal_name)( $common_meaning) ]($style) '
pipestatus_separator = '[ │ ]($style)'
pipestatus_segment_format = '[$status( $signal_name)( $common_meaning)]($style)'
pipestatus_format = '[](fg:red)[ $symbol]($style)$pipestatus[ ]($style) '

[cmd_duration]
min_time = 2000
style = 'bg:yellow fg:crust'
format = '[](fg:yellow)[ 󰔟 $duration ]($style) '

[jobs]
symbol = '󰒓 '
style = 'bg:purple fg:crust'
format = '[](fg:purple)[ $symbol$number ]($style) '

[python]
symbol = ' '
style = 'bg:cyan fg:crust'
format = '[](fg:cyan)[ ${symbol}${version}( \($virtualenv\)) ]($style) '

[nodejs]
symbol = ' '
style = 'bg:cyan fg:crust'
format = '[](fg:cyan)[ $symbol$version ]($style) '

[rust]
symbol = ' '
style = 'bg:cyan fg:crust'
format = '[](fg:cyan)[ $symbol$version ]($style) '

[golang]
symbol = ' '
style = 'bg:cyan fg:crust'
format = '[](fg:cyan)[ $symbol$version ]($style) '

[time]
disabled = false
time_format = '%H:%M:%S'
style = 'bg:surface1 fg:text'
format = '[](fg:surface1)[ 󰅐 $time ]($style)'

# ---- Line 2 ----------------------------------------------------------------------------
[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
format = '$symbol '
