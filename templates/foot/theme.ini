# {{ name }} for foot (>= 1.26: [colors-dark]; the old [colors] section stops foot 1.28 from starting).
# Deployed to ~/.config/foot/theme.ini, included by foot.ini. Colors are RRGGBB without '#'.
[colors-dark]
alpha=1.0
foreground={{ text | bare }}
background={{ base | bare }}
# cursor=<text color> <cursor color>
cursor={{ base | bare }} {{ yellow | bare }}
selection-foreground={{ text | bare }}
selection-background={{ surface1 | bare }}
urls={{ blue | bare }}
jump-labels={{ crust | bare }} {{ orange | bare }}
search-box-no-match={{ crust | bare }} {{ red | bare }}
search-box-match={{ text | bare }} {{ surface0 | bare }}

regular0={{ surface1 | bare }}
regular1={{ red | bare }}
regular2={{ green | bare }}
regular3={{ yellow | bare }}
regular4={{ blue | bare }}
regular5={{ purple | bare }}
regular6={{ cyan | bare }}
regular7={{ subtext | bare }}

bright0={{ overlay | bare }}
bright1={{ bright_red | bare }}
bright2={{ bright_green | bare }}
bright3={{ bright_yellow | bare }}
bright4={{ bright_blue | bare }}
bright5={{ bright_purple | bare }}
bright6={{ bright_cyan | bare }}
bright7={{ bright | bare }}
