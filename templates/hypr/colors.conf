# {{ name }} palette for the hyprlang tools (hyprlock, hypridle, hyprtoolkit).
# Usage: source = ~/.config/hypr/theme/colors.conf, then $red, $crust_a60, ...
# Values are hyprlang colors: rgba(RRGGBBAA).
$crust    = {{ crust | rgba }}
$mantle   = {{ mantle | rgba }}
$base     = {{ base | rgba }}
$surface0 = {{ surface0 | rgba }}
$surface1 = {{ surface1 | rgba }}
$surface2 = {{ surface2 | rgba }}
$overlay  = {{ overlay | rgba }}
$subtext  = {{ subtext | rgba }}
$text     = {{ text | rgba }}
$bright   = {{ bright | rgba }}

$red      = {{ red | rgba }}
$orange   = {{ orange | rgba }}
$yellow   = {{ yellow | rgba }}
$green    = {{ green | rgba }}
$cyan     = {{ cyan | rgba }}
$blue     = {{ blue | rgba }}
$purple   = {{ purple | rgba }}
$pink     = {{ pink | rgba }}

# Translucent variants (hyprlang has no alpha operator).
$crust_a45    = {{ crust | rgba:0.45 }}
$surface0_a85 = {{ surface0 | rgba:0.85 }}
$transparent  = {{ crust | rgba:0 }}
