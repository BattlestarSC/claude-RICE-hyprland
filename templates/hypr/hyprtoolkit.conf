# {{ name }} for hyprtoolkit: the toolkit behind the polkit password prompt (hyprpolkitagent),
# hyprshutdown and the hyprland-guiutils dialogs. Deployed to ~/.config/hypr/hyprtoolkit.conf
# (hyprlang). Keys: hyprtoolkit src/palette/ConfigManager.cpp (v0.6.0), checked by
# tests/hypr/check_hyprtoolkit.py. Colors inline (no `source`), same roles as GTK and the bar:
# dark glass surfaces, purple accent, red -> purple like the window border.

background = rgba({{ base | bare }}FF)
base = rgba({{ mantle | bare }}FF)
alternate_base = rgba({{ surface0 | bare }}FF)
text = rgba({{ text | bare }}FF)
bright_text = rgba({{ bright | bare }}FF)
link_text = rgba({{ blue | bare }}FF)
accent = rgba({{ purple | bare }}FF)
accent_secondary = rgba({{ red | bare }}FF)

# Corners: the bar's pills and panels use 10, windows 6.
rounding_large = 10
rounding_small = 6

font_family = IBM Plex Sans
font_family_monospace = JetBrains Mono
icon_theme = Papirus-Dark
