# {{ name }} for Qt 6 apps through qt6ct (Strawberry, Kasts and any other Qt app without its own
# theme). Deployed to ~/.config/qt6ct/colors/rice.conf; ~/.config/qt6ct/qt6ct.conf points to it.
# One color per QPalette::ColorRole, in enum order (WindowText, Button, Light, Midlight, Dark, Mid, Text, BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText, Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText, PlaceholderText, Accent), as #AARRGGBB; format: qt6ct src/qt6ct-common/qt6ct.cpp
# loadColorScheme. Selection purple with crust text, as in the GTK and KDE schemes.
# Docs: docs/knowledge-base/theming.md#qt-apps-qt6ct

