; {{ name }} for TeXstudio. Installed to ~/.config/texstudio/texstudio.ini only if that file does not
; exist yet (TeXstudio rewrites it with all settings when it exits; later runs leave it alone).
; UI: the built-in "Adwaita Dark (txs)" style, which also switches TeXstudio's syntax colors to its
; dark set; those are replaced here by the palette ([formatsDark], QFormatScheme 1.0). Keys and
; format ids: TeXstudio src/configmanager.cpp, utilities/qxs/defaultFormatsDark.qxf (checked by
; tests/office/check_office.py). Same role mapping as the editors: commands red, environments cyan,
; math green/yellow, comments overlay.

[texmaker]
X11\Style=Adwaita Dark (txs)
Editor\Font%20Family=JetBrains Mono
Editor\Font%20Size=12

[formatsDark]
version=1.0
data\comment\foreground={{ overlay }}
data\comment\italic=true
data\commentTodo\foreground={{ yellow }}
data\commentTodo\bold=true
data\magicComment\foreground={{ green }}
data\magicComment\italic=true
data\keyword\foreground={{ red }}
data\extra-keyword\foreground={{ purple }}
data\extra-keyword\bold=true
data\environment\foreground={{ cyan }}
data\structure\foreground={{ orange }}
data\structure\bold=true
data\math-keyword\foreground={{ green }}
data\math-delimiter\foreground={{ yellow }}
data\math-text\foreground={{ yellow }}
data\numbers\foreground={{ purple }}
data\verbatim\foreground={{ yellow }}
data\escapeseq\foreground={{ pink }}
data\link\foreground={{ blue }}
data\link\underline=true
data\align-ampersand\foreground={{ pink }}
data\align-ampersand\bold=true
data\braceMatch\background={{ surface2 }}
data\braceMatch\bold=true
data\braceMismatch\background={{ red }}
data\braceMismatch\foreground={{ crust }}
data\braceMismatch\bold=true
data\current\background={{ surface0 }}
data\selection\background={{ surface2 }}
data\search\background={{ yellow }}
data\search\foreground={{ crust }}
data\replacement\background={{ pink }}
data\replacement\foreground={{ crust }}
data\spellingMistake\waveUnderline=true
data\spellingMistake\linescolor={{ red }}
data\grammarMistake\waveUnderline=true
data\grammarMistake\linescolor={{ blue }}
data\referencePresent\foreground={{ green }}
data\referenceMissing\foreground={{ red }}
data\referenceMissing\waveUnderline=true
data\referenceMultiple\foreground={{ orange }}
data\referenceMultiple\waveUnderline=true
data\citationPresent\foreground={{ green }}
data\citationMissing\foreground={{ red }}
data\citationMissing\waveUnderline=true
data\packagePresent\foreground={{ green }}
data\packageMissing\foreground={{ red }}
data\packageMissing\waveUnderline=true
data\picture-keyword\foreground={{ cyan }}
