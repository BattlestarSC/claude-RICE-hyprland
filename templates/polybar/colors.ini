; {{ name }} palette for polybar, included by ~/.config/polybar/config.ini (include-file).
; polybar colors are #AARRGGBB (alpha first), like QML.
[colors]
crust    = {{ crust }}
mantle   = {{ mantle }}
base     = {{ base }}
surface0 = {{ surface0 }}
surface1 = {{ surface1 }}
surface2 = {{ surface2 }}
overlay  = {{ overlay }}
subtext  = {{ subtext }}
text     = {{ text }}
bright   = {{ bright }}
red      = {{ red }}
orange   = {{ orange }}
yellow   = {{ yellow }}
green    = {{ green }}
cyan     = {{ cyan }}
blue     = {{ blue }}
purple   = {{ purple }}
pink     = {{ pink }}
; The bar: dark glass like the Quickshell bar (mantle at 80 %), blurred by picom.
glass        = {{ mantle | qcolor:0.80 }}
pill         = {{ surface0 | qcolor:0.90 }}
transparent  = {{ crust | qcolor:0 }}
