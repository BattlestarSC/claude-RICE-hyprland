# {{ name }} palette for i3 window decorations. ~/.config/i3/config includes this file.
# The rice draws no title bars (default_border pixel 2): child_border is the window border,
# indicator marks where the next window opens. i3 cannot draw Hyprland's red-to-purple gradient,
# so focus is purple and urgency red; picom adds the rounding, shadows and blur.
# class                 border             background         text               indicator          child_border
client.focused          {{ purple }}       {{ surface1 }}     {{ bright }}       {{ pink }}         {{ purple }}
client.focused_inactive {{ surface2 }}     {{ surface0 }}     {{ subtext }}      {{ surface2 }}     {{ surface2 }}
client.focused_tab_title {{ surface2 }}    {{ surface0 }}     {{ text }}
client.unfocused        {{ surface1 }}     {{ mantle }}       {{ overlay }}      {{ surface1 }}     {{ surface1 }}
client.urgent           {{ red }}          {{ red }}          {{ crust }}        {{ red }}          {{ red }}
client.placeholder      {{ crust }}        {{ base }}         {{ text }}         {{ crust }}        {{ base }}
client.background       {{ crust }}
