[meta]
name = "Quasar"
tagline = "The rice palette. Pulsar's dark base and Monokai hues, Event Horizon's softer text, accents evened out in perceived lightness."
blend = "pulsar -> event-horizon: bg 0.3, fg 0.55, accent 0.4"
border_gradient = ["red", "purple"]
cursor = "yellow"

